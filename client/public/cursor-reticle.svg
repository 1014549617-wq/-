<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Green crosshair lines -->
  <line x1="12" y1="2" x2="12" y2="9" stroke="#5a8f6a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="15" x2="12" y2="22" stroke="#5a8f6a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="12" x2="9" y2="12" stroke="#5a8f6a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="12" x2="22" y2="12" stroke="#5a8f6a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Subtle glow on crosshair ends -->
  <circle cx="12" cy="2" r="1.5" fill="#5a8f6a" opacity="0.6"/>
  <circle cx="12" cy="22" r="1.5" fill="#5a8f6a" opacity="0.6"/>
  <circle cx="2" cy="12" r="1.5" fill="#5a8f6a" opacity="0.6"/>
  <circle cx="22" cy="12" r="1.5" fill="#5a8f6a" opacity="0.6"/>
  <!-- Red center dot -->
  <circle cx="12" cy="12" r="2" fill="none" stroke="#a83232" stroke-width="1.2"/>
  <circle cx="12" cy="12" r="0.8" fill="#a83232" opacity="0.8"/>
</svg>
